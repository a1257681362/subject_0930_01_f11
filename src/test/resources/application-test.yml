spring:
  datasource:
    url: jdbc:h2:mem:testcoldchain;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.evops
  configuration:
    map-underscore-to-camel-case: true

# 集成测试直调服务模拟定时扫描，关闭后台定时器避免并发干扰：
# - alert-scan：V5 温控预警定时扫描
# - exception-clock：V6 异常处置时钟扫描（逾期升级/失败通知重试）
coldchain:
  alert-scan:
    enabled: false
  exception-clock:
    enabled: false
  quote-expire:
    enabled: false
